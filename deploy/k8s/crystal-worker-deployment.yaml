apiVersion: apps/v1
kind: Deployment
metadata:
  name: bangplanix-crystal-worker
  namespace: bangplanix
  labels:
    app: bangplanix-crystal-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bangplanix-crystal-worker
  template:
    metadata:
      labels:
        app: bangplanix-crystal-worker
    spec:
      containers:
      - name: crystal-worker
        image: bangplanix/crystal-worker:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: bangplanix-crystal-worker
  namespace: bangplanix
  labels:
    app: bangplanix-crystal-worker
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    name: http
  selector:
    app: bangplanix-crystal-worker
