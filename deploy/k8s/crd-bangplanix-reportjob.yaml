apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: reportjobs.bangplanix.io
  annotations:
    controller-gen.kubebuilder.io/version: v0.14.0
spec:
  group: bangplanix.io
  names:
    kind: BangplanixReportJob
    listKind: BangplanixReportJobList
    plural: reportjobs
    singular: reportjob
    shortNames:
      - repjob
      - bpxjob
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - templateRef
                - outputFormat
              properties:
                templateRef:
                  type: string
                  description: "Path or S3 URI to the .bpx report template"
                outputFormat:
                  type: string
                  enum: ["pdf", "xlsx", "csv", "svg", "html", "ndjson"]
                  default: "pdf"
                cronSchedule:
                  type: string
                  description: "Optional 5-field Cron schedule (e.g. '0 8 1 * *')"
                concurrencyPolicy:
                  type: string
                  enum: ["Allow", "Forbid", "Replace"]
                  default: "Forbid"
                parameters:
                  type: object
                  additionalProperties:
                    type: string
                splitKeyField:
                  type: string
                  description: "Data-driven bursting key field (e.g. 'CustomerId')"
                deliveryTargets:
                  type: array
                  items:
                    type: object
                    required:
                      - channel
                    properties:
                      channel:
                        type: string
                        enum: ["smtp", "s3", "azureBlob", "sftp", "webhook"]
                      destination:
                        type: string
                      credentialsSecretRef:
                        type: string
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: ["Pending", "Running", "Succeeded", "Failed"]
                lastExecutionTime:
                  type: string
                  format: date-time
                nextScheduledTime:
                  type: string
                  format: date-time
                totalSlices:
                  type: integer
                succeededSlices:
                  type: integer
                failedSlices:
                  type: integer
                lastErrorMessage:
                  type: string
      additionalPrinterColumns:
        - name: Template
          type: string
          jsonPath: .spec.templateRef
        - name: Schedule
          type: string
          jsonPath: .spec.cronSchedule
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
