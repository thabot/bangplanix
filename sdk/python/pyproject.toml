[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bangplanix"
version = "1.0.0"
authors = [
  { name="Thabot Bangplanix Team", email="thabot47@gmail.com" },
]
description = "Official High-Speed Python SDK for Bangplanix Reporting Engine"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
dependencies = [
    "urllib3>=1.26.0"
]