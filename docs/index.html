<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bangplanix — WASM In-Browser Engine & Interactive Live Playground</title>
  <link rel="stylesheet" href="src/playground.css">
</head>
<body>
  <header>
    <div class="brand">
      <span>🚀 Bangplanix</span>
      <span class="brand-badge">WASM PLAYGROUND</span>
    </div>
    <div class="header-actions">
      <label for="sample-select" style="font-size: 13px; color: var(--text-muted);">Template:</label>
      <select id="sample-select" class="btn">
        <option value="invoice">1. Commercial Tax Invoice (Standard)</option>
        <option value="thai_etax">2. ใบกำกับภาษี e-Tax (มธอ. 3-2560)</option>
        <option value="pos_receipt">3. สลิปใบเสร็จ POS 80mm (ESC/POS)</option>
        <option value="shipping_label">4. ฉลากขนส่ง Logistics 4x6 (Zebra ZPL)</option>
        <option value="payslip">5. สลิปเงินเดือนพนักงาน (HR Payslip)</option>
      </select>
      <a href="designer.html" class="btn" style="background: #2563eb; color: white; text-decoration: none; display: inline-flex; align-items: center; font-weight: 600;">🎨 Visual Designer</a>
      <button id="export-svg-btn" class="btn">📥 Export SVG</button>
      <button id="theme-toggle-btn" class="btn">☀️ Light</button>
      <a href="pricing.html" class="btn" style="background: linear-gradient(135deg, #10b981, #059669); color: white; text-decoration: none; display: inline-flex; align-items: center; font-weight: 600;">💎 Get License</a>
    </div>
  </header>

  <div id="error-banner" class="error-banner"></div>

  <div class="playground-layout">
    <!-- Editor Pane -->
    <div class="pane">
      <div class="pane-header">
        <span>📄 .bpx Template Definition (JSON Schema v1)</span>
      </div>
      <div class="editor-wrapper">
        <textarea id="bpx-editor" spellcheck="false"></textarea>
      </div>
    </div>

    <!-- Live Preview Pane with Viewer Toolbar -->
    <div class="pane preview-pane" id="preview-pane">
      <div class="viewer-toolbar">
        <div class="viewer-toolbar-group">
          <span class="viewer-title">👁️ Preview</span>
          <button id="search-btn" class="viewer-btn" title="Search document (Ctrl+F)">🔍 Search</button>
        </div>

        <div class="viewer-toolbar-group">
          <button id="zoom-out-btn" class="viewer-btn" title="Zoom Out">−</button>
          <select id="zoom-select" class="viewer-select" title="Zoom Level">
            <option value="50">50%</option>
            <option value="75">75%</option>
            <option value="100" selected>100%</option>
            <option value="125">125%</option>
            <option value="150">150%</option>
            <option value="200">200%</option>
            <option value="300">300%</option>
            <option value="fit-width">Fit Width</option>
            <option value="fit-page">Fit Page</option>
          </select>
          <button id="zoom-in-btn" class="viewer-btn" title="Zoom In">+</button>
          <button id="fit-width-btn" class="viewer-btn desktop-only" title="Fit to Width">↔ Fit Width</button>
          <button id="fit-page-btn" class="viewer-btn desktop-only" title="Fit to Page">↕ Fit Page</button>
        </div>

        <div class="viewer-toolbar-group">
          <button id="print-btn" class="viewer-btn" title="Print Document">🖨️ Print</button>
          <button id="fullscreen-btn" class="viewer-btn" title="Toggle Fullscreen">⛶ Fullscreen</button>
        </div>
      </div>

      <!-- In-document Search Bar -->
      <div id="search-panel" class="search-panel" style="display: none;">
        <input id="search-input" type="text" placeholder="Find text in report..." />
        <span id="search-counter" class="search-counter"></span>
        <button id="search-prev-btn" class="viewer-btn-sm" title="Previous match">▲</button>
        <button id="search-next-btn" class="viewer-btn-sm" title="Next match">▼</button>
        <button id="search-close-btn" class="viewer-btn-sm" title="Close search">✕</button>
      </div>

      <div class="preview-scroll-area" id="preview-scroll-area">
        <div class="preview-canvas-wrapper" id="preview-canvas-wrapper">
          <!-- Live SVG Render Output -->
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { BangplanixPlayground } from './src/playground.js';
    window.addEventListener('DOMContentLoaded', () => {
      new BangplanixPlayground();
    });
  </script>
</body>
</html>
