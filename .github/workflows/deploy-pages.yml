name: Deploy Bangplanix Documentation & Visual Designer to GitHub Pages

on:
  push:
    branches:
      - uat
      - main
    paths:
      - 'docs/**'
      - 'frontend/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Compile TypeScript Architecture
        run: |
          npx -p typescript tsc -p docs/tsconfig.json
          cp frontend/designer/designer-core.js docs/src/dist/designer/designer-core.js

      - name: Run Web Unit Tests (Node.js Test Runner)
        run: |
          node --test docs/src/tests/*.test.js

      - name: Run Web Visual Designer Lit Tests
        run: |
          node --test frontend/designer/tests/designer.test.js

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
